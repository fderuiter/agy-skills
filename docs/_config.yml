title: "agy-skills | Agent Skills for Google Antigravity"
description: "Production-grade, low-cognitive-load agent skills and workflows for Google Antigravity (AGY)."
url: "https://fderuiter.github.io"
baseurl: "/agy-skills"
repository: "fderuiter/agy-skills"
author:
  name: "Fred de Ruiter"
  github: "fderuiter"
twitter:
  username: "fderuiter"
logo: "/assets/images/og-card.png"

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

include:
  - README.md
  - robots.txt
  - sitemap.xml

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "engineering"
    values:
      category: "engineering"
  - scope:
      path: "productivity"
    values:
      category: "productivity"
  - scope:
      path: "dictionary"
    values:
      category: "dictionary"

google_site_verification: ""
