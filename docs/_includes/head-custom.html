<!-- Favicons & Icons -->
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- Search Engine Verification -->
{% if site.google_site_verification and site.google_site_verification != "" %}
<meta name="google-site-verification" content="{{ site.google_site_verification }}">
{% endif %}

<!-- Schema.org JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "SoftwareApplication",
      "@id": "{{ site.url }}{{ site.baseurl }}/#software",
      "name": "agy-skills",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Google Antigravity, Claude Code",
      "description": "{{ site.description }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "downloadUrl": "https://github.com/fderuiter/agy-skills",
      "author": {
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "url": "https://github.com/{{ site.author.github }}"
      }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ site.url }}{{ site.baseurl }}/"
        }
        {% if page.category %}
        ,{
          "@type": "ListItem",
          "position": 2,
          "name": "{{ page.category | capitalize }} Skills",
          "item": "{{ site.url }}{{ site.baseurl }}/#{{ page.category }}-skills"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "{{ page.title | default: page.name }}",
          "item": "{{ page.url | absolute_url }}"
        }
        {% endif %}
      ]
    }
    {% if page.category %}
    ,{
      "@type": "TechArticle",
      "@id": "{{ page.url | absolute_url }}#article",
      "headline": "{{ page.title | default: page.name }}",
      "description": "{{ page.description }}",
      "url": "{{ page.url | absolute_url }}",
      "inLanguage": "en-US",
      "author": {
        "@type": "Person",
        "name": "{{ site.author.name }}"
      },
      "publisher": {
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "url": "https://github.com/{{ site.author.github }}"
      }
    }
    {% endif %}
  ]
}
</script>
