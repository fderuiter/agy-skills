<!-- Favicons & Icons -->
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- Material Design 3 Typography & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,300..700&family=Roboto+Mono:wght@400;500;600&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<!-- Material Design 3 Theme Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/m3-theme.css' | relative_url }}">

<!-- Search Engine Verification -->
{% if site.google_site_verification and site.google_site_verification != "" %}
<meta name="google-site-verification" content="{{ site.google_site_verification }}">
{% endif %}

<!-- Schema.org JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "SoftwareApplication",
      "@id": "{{ site.url }}{{ site.baseurl }}/#software",
      "name": "agy-skills",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Google Antigravity",
      "description": "{{ site.description }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "downloadUrl": "https://github.com/fderuiter/agy-skills",
      "author": {
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "url": "https://github.com/{{ site.author.github }}"
      }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "{{ site.url }}{{ site.baseurl }}/"
        }
        {% if page.category %}
        ,{
          "@type": "ListItem",
          "position": 2,
          "name": "{{ page.category | capitalize }} Skills",
          "item": "{{ site.url }}{{ site.baseurl }}/#{{ page.category }}-skills"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "{{ page.title | default: page.name }}",
          "item": "{{ page.url | absolute_url }}"
        }
        {% endif %}
      ]
    }
    {% if page.category %}
    ,{
      "@type": "TechArticle",
      "@id": "{{ page.url | absolute_url }}#article",
      "headline": "{{ page.title | default: page.name }}",
      "description": "{{ page.description }}",
      "url": "{{ page.url | absolute_url }}",
      "inLanguage": "en-US",
      "author": {
        "@type": "Person",
        "name": "{{ site.author.name }}"
      },
      "publisher": {
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "url": "https://github.com/{{ site.author.github }}"
      }
    }
    {% endif %}
  ]
}
</script>
