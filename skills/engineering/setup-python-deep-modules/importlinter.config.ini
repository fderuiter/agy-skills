[importlinter]
root_packages =
    packages

[importlinter:contract:entrypoints-from-app]
name = Entry point boundary from app
type = forbidden
source_modules =
    app
forbidden_modules =
    packages.*._lib
    packages.*.lib

[importlinter:contract:entrypoints-across-packages]
name = Entry point boundary across packages
type = forbidden
source_modules =
    packages
forbidden_modules =
    packages.*._lib
    packages.*.lib
ignore_imports =
    packages.$1._lib -> packages.$1._lib
    packages.$1.lib -> packages.$1.lib

[importlinter:contract:tests-through-entrypoints]
name = Tests through entry points
type = forbidden
source_modules =
    packages.*.tests
forbidden_modules =
    packages.*._lib
    packages.*.lib

[importlinter:contract:tests-private]
name = Tests folder is private
type = forbidden
source_modules =
    app
    packages
forbidden_modules =
    packages.*.tests
ignore_imports =
    packages.$1.tests -> packages.$1.tests

[importlinter:contract:no-cycles]
name = No cycles
type = independence
modules =
    packages

